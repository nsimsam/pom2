<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-label="Diagram of the Centralized Learning Initiative. A weekly run keeps a content reservoir current: the Obsidian vault holding inherited upper-year notes, this year's slides via the OneNote MCP server, and Schulich review slides. From that reservoir come three exposures to the same material: charts to understand, Anki to remember, and a Q-bank to apply. All three feed an open-source GitHub repo, kept current by first and second year reps, which in turn feeds class workshops on one side and the GitHub Page on the other.">
  <style>
    .box { fill: #ffffff; stroke: #cfcabd; stroke-width: 1.75; }
    .box.out { fill: #fdf3e6; stroke: #c8781c; stroke-width: 2.75; }
    .pill { fill: none; stroke: #c8781c; stroke-width: 1.5; }
    .pn { fill: #96540f; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-anchor: middle; }
    .t { fill: #1c1b19; font-size: 17px; font-weight: 650; }
    .t.out { fill: #96540f; }
    .s { fill: #5a5750; font-size: 13.5px; }
    .edge { stroke: #1c1b19; stroke-width: 2; fill: none; opacity: .5; }
    .lbl { fill: #5a5750; font-size: 12.5px; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0" y="0" width="1000" height="780" fill="#fbfaf7"/>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="edge">
    <line x1="264" y1="124" x2="284" y2="124" marker-end="url(#a)"/>
    <polyline points="633,204 633,240"/>
    <line x1="174" y1="240" x2="826" y2="240"/>
    <line x1="174" y1="240" x2="174" y2="272" marker-end="url(#a)"/>
    <line x1="500" y1="240" x2="500" y2="272" marker-end="url(#a)"/>
    <line x1="826" y1="240" x2="826" y2="272" marker-end="url(#a)"/>
    <polyline points="174,506 174,546 826,546 826,506"/>
    <line x1="500" y1="506" x2="500" y2="546"/>
    <line x1="500" y1="546" x2="500" y2="586" marker-end="url(#a)"/>
    <line x1="346" y1="670" x2="326" y2="670" marker-end="url(#a)"/>
    <line x1="654" y1="670" x2="674" y2="670" marker-end="url(#a)"/>
  </g>

  <!-- ===== the weekly run ===== -->
  <rect class="box" x="24" y="70" width="240" height="108" rx="9"/>
  <text class="t" x="44" y="102">the weekly run</text>
  <text class="s" x="44" y="134">pom2-week, stages 0-8</text>
  <text class="s" x="44" y="158">keeps the reservoir current</text>

  <!-- ===== reservoir ===== -->
  <rect class="box" x="290" y="44" width="686" height="160" rx="11"/>
  <text class="t" x="314" y="80">content reservoir</text>
  <text class="s" x="472" y="80">the Obsidian vault, one place everything is read from</text>
  <text class="s" x="314" y="118">·  Maggie's notes and the other upper-year resources we inherited</text>
  <text class="s" x="314" y="148">·  this year's slides, pulled through the OneNote MCP server</text>
  <text class="s" x="314" y="178">·  Schulich review slides?</text>

  <!-- ===== three exposures ===== -->
  <rect class="box out" x="24" y="272" width="300" height="234" rx="11"/>
  <rect class="pill" x="206" y="288" width="106" height="23" rx="11.5"/>
  <text class="pn" x="259" y="304">1 · UNDERSTAND</text>
  <text class="t out" x="46" y="318">Charts</text>
  <text class="s" x="46" y="354">Nicole's notes style</text>
  <text class="s" x="46" y="386">high-yield summary notes, organized</text>
  <text class="s" x="46" y="410">in charts, with keywords bolded</text>

  <rect class="box out" x="350" y="272" width="300" height="234" rx="11"/>
  <rect class="pill" x="532" y="288" width="106" height="23" rx="11.5"/>
  <text class="pn" x="585" y="304">2 · REMEMBER</text>
  <text class="t out" x="372" y="318">Anki</text>
  <text class="s" x="372" y="354">Christina style</text>
  <text class="s" x="372" y="386">a delta against the class deck,</text>
  <text class="s" x="372" y="410">not a deck built from scratch</text>

  <rect class="box out" x="676" y="272" width="300" height="234" rx="11"/>
  <rect class="pill" x="858" y="288" width="106" height="23" rx="11.5"/>
  <text class="pn" x="911" y="304">3 · APPLY</text>
  <text class="t out" x="698" y="318">Q-bank</text>
  <text class="s" x="698" y="354">·  Pre-Clerkship Workbook, Hippo Q-bank</text>
  <text class="s" x="712" y="378">→ out of the PDF</text>
  <text class="s" x="698" y="408">·  module Qs, the weekly quiz</text>
  <text class="s" x="712" y="432">→ out of Elentra, by bookmarklet</text>
  <text class="s" x="698" y="462">·  new: cases from DSSGs, modules,</text>
  <text class="s" x="710" y="486">in-class sessions</text>

  <text class="lbl" x="514" y="570">1st- and 2nd-year reps keep this current</text>

  <!-- ===== the sharing layer ===== -->
  <rect class="box" x="26" y="590" width="300" height="160" rx="11"/>
  <text class="t" x="48" y="624">class workshops</text>
  <text class="s" x="48" y="656">customize it to your own learning</text>
  <text class="s" x="48" y="690">onboarding run with the</text>
  <text class="s" x="48" y="714">Open-Source Medicine Club and</text>
  <text class="s" x="48" y="738">the AI in Medicine Club</text>

  <rect class="box" x="350" y="590" width="300" height="160" rx="11"/>
  <text class="t" x="372" y="624">open-source GitHub repo</text>
  <text class="s" x="372" y="656">one place the whole class pulls from</text>
  <text class="s" x="372" y="690">and the reason this outlives our</text>
  <text class="s" x="372" y="714">year: next year's reps inherit it,</text>
  <text class="s" x="372" y="738">they don't rebuild it</text>

  <rect class="box" x="674" y="590" width="300" height="160" rx="11"/>
  <text class="t" x="696" y="624">GitHub Page</text>
  <text class="s" x="696" y="656">the centralized, public front door</text>
  <text class="s" x="696" y="690">one link to hand a first-year,</text>
  <text class="s" x="696" y="714">instead of a folder of folders</text>
</svg>
